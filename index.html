<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>生日抽奖</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0714;color:#f2eefb;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}

  .scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:32px 22px;opacity:0;pointer-events:none;
    transition:opacity .5s ease}
  .scr.on{opacity:1;pointer-events:auto}
  .scr.gone{opacity:0;pointer-events:none}

  .kicker{font-size:13px;letter-spacing:6px;color:#8a80a8}
  h1{font-size:24px;font-weight:600;letter-spacing:2px;text-align:center}
  .sub{font-size:13px;color:#8a80a8;letter-spacing:1px;text-align:center;line-height:1.9}

  /* 转盘 */
  .wheel{position:relative;width:min(78vw,320px);aspect-ratio:1/1;margin:6px 0}
  .disc{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(
      #2b2440 0deg 72deg,
      #3a3060 72deg 144deg,
      #2b2440 144deg 216deg,
      #3a3060 216deg 288deg,
      #f5b942 288deg 360deg);
    box-shadow:0 0 0 8px #171128,0 0 0 9px #2f2648,0 18px 50px rgba(0,0,0,.6);
    transition:transform 3.8s cubic-bezier(.16,.72,.16,1);
    will-change:transform}
  .lbl{position:absolute;left:50%;top:50%;width:0;height:0;font-size:12px;
    color:#e8e2f7;letter-spacing:1px;white-space:nowrap}
  .lbl span{position:absolute;transform:translate(-50%,-50%)}
  .lbl.gold{color:#3a2a00;font-weight:700}

  .pin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);
    width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
    border-top:22px solid #fff;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:3}

  #go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:26%;aspect-ratio:1/1;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#fff,#d9d2ef);
    color:#1a1230;font-size:15px;font-weight:700;letter-spacing:2px;
    box-shadow:0 6px 18px rgba(0,0,0,.55),0 0 0 4px #0a0714;
    transition:transform .12s}
  #go:active{transform:translate(-50%,-50%) scale(.94)}
  #go[disabled]{opacity:.5}

  .msg{font-size:15px;color:#c9c0e0;letter-spacing:1px;text-align:center;
    min-height:24px;line-height:1.7}

  /* 中奖卡 */
  #s1{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:24px 20px 36px}
  #s1 .card{margin:auto 0}
  .card{width:min(84vw,340px);border-radius:20px;padding:26px 22px;
    background:linear-gradient(160deg,#221a3a,#151024);
    border:1px solid #3a2f5c;box-shadow:0 24px 60px rgba(0,0,0,.7);
    display:flex;flex-direction:column;gap:14px;align-items:center}
  .badge{font-size:12px;letter-spacing:4px;color:#f5b942;text-align:center}
  .prize{font-size:22px;font-weight:700;text-align:center;line-height:1.55;white-space:pre-wrap}
  .row{width:100%;display:flex;justify-content:space-between;gap:14px;font-size:14px;
    color:#a99fc4;padding:9px 0;border-bottom:1px dashed #2e2547}
  .row b{color:#f2eefb;font-weight:500;text-align:right}
  .row:last-of-type{border-bottom:none}
  #claim{width:100%;margin-top:6px;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(90deg,#f5b942,#ffd97a);color:#2a1d00;
    font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer}
  #claim:active{opacity:.85}

  /* 领取清单 + 一封信 */
  #s2{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:24px 24px 22px;gap:0}
  .recv{width:min(86vw,350px);display:flex;flex-direction:column}
  .recv .h{font-size:11px;letter-spacing:5px;color:#8a80a8;text-align:center;margin-bottom:14px}
  .recv .it{display:flex;justify-content:space-between;align-items:center;
    font-size:15px;padding:9px 2px;border-bottom:1px solid #221a38;
    opacity:0;transform:translateY(8px)}
  .recv .it b{color:#f5b942;font-weight:600;font-size:12px;letter-spacing:1px}
  .recv .it:last-child{border-bottom:none}
  @keyframes up{to{opacity:1;transform:translateY(0)}}
  #s2.on .recv .it{animation-name:up;animation-duration:.5s;
    animation-timing-function:ease;animation-fill-mode:forwards}
  .letter{margin-top:16px;font-size:14.5px;line-height:2;color:#c9c0e0;
    letter-spacing:.4px}
  .letter p{opacity:0;transform:translateY(8px)}
  .letter p.g{line-height:.55}
  #s2.on .letter p{animation-name:up;animation-duration:.7s;
    animation-timing-function:ease;animation-fill-mode:forwards}
  #done{margin-top:17px;padding:14px 36px;border-radius:12px;border:1px solid #3a2f5c;
    background:transparent;color:#cfc7e2;font-size:15px;font-family:inherit;
    letter-spacing:3px;cursor:pointer;opacity:0}
  #s2.on #done{animation-name:up;animation-duration:.6s;
    animation-timing-function:ease;animation-fill-mode:forwards}
  #done:active{opacity:.7}

  /* 最后一页 */
  .fin{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
  .fin .l1{font-size:15px;color:#a89fc4;letter-spacing:2px}
  .fin .l2{font-size:26px;font-weight:600;letter-spacing:3px}
  .fin .l3{font-size:14px;color:#b6aed0;letter-spacing:1px}
  .fin .sig{font-size:13px;color:#8d84a6;letter-spacing:2px;margin-top:10px}

  /* ---------- 动效 ---------- */
  .scr{z-index:1}
  #s0 .kicker,#s0 h1,#s0 .sub{animation:up .7s ease both}
  #s0 h1{animation-delay:.12s}
  #s0 .sub{animation-delay:.26s}
  .wheel{animation:wIn .9s cubic-bezier(.2,1.15,.4,1) .34s both}
  @keyframes wIn{0%{transform:scale(.84) rotate(-16deg);opacity:0}
    100%{transform:scale(1) rotate(0);opacity:1}}
  .wheel::before{content:"";position:absolute;inset:-18px;border-radius:50%;
    background:radial-gradient(circle,rgba(245,185,66,.18),transparent 66%);
    animation:halo 3.4s ease-in-out infinite;pointer-events:none;z-index:-1}
  @keyframes halo{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:.95;transform:scale(1.05)}}
  .disc.spinning{box-shadow:0 0 0 8px #171128,0 0 0 9px #2f2648,
    0 18px 50px rgba(0,0,0,.6),0 0 66px rgba(245,185,66,.4)}
  #go{animation:breath 2.6s ease-in-out infinite}
  @keyframes breath{0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.55),0 0 0 4px #0a0714}
    50%{box-shadow:0 6px 18px rgba(0,0,0,.55),0 0 0 4px #0a0714,0 0 28px rgba(245,185,66,.5)}}
  .pin{transform-origin:50% 0}
  .pin.shake{animation:shake .13s linear infinite}
  @keyframes shake{0%,100%{transform:translateX(-50%) rotate(0)}
    25%{transform:translateX(-50%) rotate(-8deg)}
    75%{transform:translateX(-50%) rotate(8deg)}}

  /* 中奖卡 */
  .card{position:relative;overflow:hidden}
  #s1.on .card{animation:cardIn .6s cubic-bezier(.2,1.25,.4,1) both}
  @keyframes cardIn{0%{transform:scale(.88) translateY(16px);opacity:0}
    100%{transform:none;opacity:1}}
  .card .ico{font-size:42px;line-height:1;filter:drop-shadow(0 8px 20px rgba(245,185,66,.4))}
  #s1.on .card .ico{animation:pop .75s cubic-bezier(.2,1.6,.4,1) .14s both}
  @keyframes pop{0%{transform:scale(0) rotate(-28deg);opacity:0}
    100%{transform:scale(1) rotate(0);opacity:1}}
  .card.gold::after{content:"";position:absolute;inset:0;border-radius:20px;
    pointer-events:none;background:linear-gradient(115deg,transparent 38%,
    rgba(245,185,66,.16) 50%,transparent 62%);background-size:300% 100%;
    animation:shine 3s ease-in-out 1s infinite}
  @keyframes shine{0%{background-position:130% 0}55%,100%{background-position:-70% 0}}
  #flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 42%,rgba(255,228,160,.85),
    rgba(245,185,66,.25) 45%,transparent 72%)}
  #flash.on{animation:flash .9s ease-out both}
  @keyframes flash{0%{opacity:.8}100%{opacity:0}}

  /* 清单图标 */
  .recv .it{justify-content:flex-start;gap:12px;animation-delay:var(--d,0s)}
  .recv .it i{font-size:19px;font-style:normal;width:26px;text-align:center;
    filter:drop-shadow(0 0 10px rgba(245,185,66,.28))}
  .recv .it span{flex:1}
  .recv .it b{opacity:0}
  #s2.on .recv .it b{animation-name:pop2;animation-duration:.45s;
    animation-timing-function:cubic-bezier(.2,1.6,.4,1);animation-fill-mode:forwards;
    animation-delay:calc(var(--d,0s) + .18s)}
  @keyframes pop2{0%{transform:scale(0);opacity:0}
    70%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}

  /* 收尾 */
  #s3 .fin > *{opacity:0;transform:translateY(10px)}
  #s3.on .fin > *{animation-name:up;animation-duration:.85s;
    animation-timing-function:ease;animation-fill-mode:forwards}
  .fin .l2{text-shadow:0 0 24px rgba(245,185,66,.4)}
  .stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .stars i{position:absolute;width:3px;height:3px;border-radius:50%;
    background:#f5b942;opacity:0;animation:tw 4.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:0;transform:translateY(0) scale(.5)}
    50%{opacity:.6;transform:translateY(-16px) scale(1)}}

  /* 编辑入口：右上角很淡的一笔 */
  #ed{position:fixed;right:10px;top:10px;width:44px;height:44px;z-index:20;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#f2eefb;opacity:.13;cursor:pointer}

  /* 编辑面板 */
  #panel{position:fixed;inset:0;z-index:30;display:none;
    background:rgba(6,4,12,.86);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:20px}
  #panel.on{display:flex}
  .pbox{width:min(90vw,370px);max-height:88vh;overflow-y:auto;
    background:linear-gradient(160deg,#1d1730,#120e20);
    border:1px solid #3a2f5c;border-radius:18px;padding:20px 18px;
    display:flex;flex-direction:column;gap:13px}
  .pt{font-size:15px;font-weight:600;letter-spacing:2px;text-align:center;margin-bottom:2px}
  .ptip{font-size:11px;color:#6f6688;text-align:center;line-height:1.7;margin-top:-6px}
  .pbox label{display:block;font-size:12px;color:#8a80a8;letter-spacing:1px}
  .pbox input,.pbox textarea{width:100%;margin-top:6px;background:#0f0b1a;
    border:1px solid #352b52;border-radius:10px;padding:11px 12px;color:#f2eefb;
    font-size:16px;font-family:inherit;line-height:1.5;outline:none;
    -webkit-user-select:text;user-select:text}
  .pbox textarea{resize:vertical;min-height:74px}
  .pbox input:focus,.pbox textarea:focus{border-color:#6a5a9e}
  .btns{display:flex;gap:10px;position:sticky;bottom:-1px;z-index:2;
    background:linear-gradient(180deg,rgba(18,14,32,0),#120e20 45%);
    padding:12px 0 2px;margin-top:0}
  .btns button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid #3a2f5c;
    background:#1a1430;color:#cfc7e2;font-size:14px;font-family:inherit;cursor:pointer}
  #bsave{background:linear-gradient(90deg,#f5b942,#ffd97a);color:#2a1d00;
    border:none;font-weight:700}
  #bsave:active,.btns button:active{opacity:.8}
  #lnk{display:none;font-size:11px;color:#8a80a8;word-break:break-all;line-height:1.6;
    background:#0f0b1a;border:1px solid #2a2242;border-radius:8px;padding:9px;
    -webkit-user-select:text;user-select:text}
  #lnk.on{display:block}
</style>
</head>
<body>

<!-- 开场 -->
<div class="scr on" id="s0">
  <div class="kicker">11 · 12</div>
  <h1 id="ttl">陆玉纯的生日抽奖</h1>
  <div class="sub">三次机会<br>点中间按钮</div>
  <div class="wheel">
    <div class="pin"></div>
    <div class="disc" id="disc"></div>
    <button id="go">抽奖</button>
  </div>
  <div class="msg" id="msg">点一下试试</div>
</div>

<!-- 中奖 -->
<div class="scr" id="s1">
  <div class="card" id="pcard">
    <div class="ico" id="pIco">🏆</div>
    <div class="badge" id="pBadge">特 等 奖</div>
    <div class="prize" id="pPrize">一个从常熟<br>过来的人</div>
    <div class="row"><span>领取方式</span><b id="pR1">抬头</b></div>
    <div class="row"><span>送达时间</span><b id="pR2">周五晚上</b></div>
    <div class="row"><span>有效期</span><b id="pR3">你说了算</b></div>
    <button id="claim">确认领取</button>
  </div>
</div>

<!-- 领取清单 + 一封信 -->
<div class="scr" id="s2">
  <div class="recv">
    <div class="h">已 领 取</div>
    <div class="it" style="--d:.15s"><i>💐</i><span>一束花</span><b>✓</b></div>
    <div class="it" style="--d:.35s"><i>🎂</i><span>一个蛋糕</span><b>✓</b></div>
    <div class="it" style="--d:.55s"><i>🧧</i><span>520 红包</span><b>✓</b></div>
    <div class="it" style="--d:.75s"><i>🤗</i><span>一个拥抱</span><b>到 了 再 给</b></div>
  </div>
  <div class="letter">
    <p style="animation-delay:.95s">从上次见你到现在，</p>
    <p style="animation-delay:1.35s">隔了好几年。</p>
    <p class="g" style="animation-delay:1.85s">&nbsp;</p>
    <p style="animation-delay:2.05s">几年里各忙各的，</p>
    <p style="animation-delay:2.45s">日子也就那么过。</p>
    <p class="g" style="animation-delay:2.95s">&nbsp;</p>
    <p style="animation-delay:3.15s">我以为有些事就这么淡了。</p>
    <p class="g" style="animation-delay:3.75s">&nbsp;</p>
    <p style="animation-delay:3.95s">结果今年又联系上了。</p>
    <p style="animation-delay:4.35s">一开口，还是原来的样子。</p>
    <p class="g" style="animation-delay:4.95s">&nbsp;</p>
    <p style="animation-delay:5.15s">那这次我自己过来。</p>
    <p class="g" style="animation-delay:5.75s">&nbsp;</p>
    <p style="animation-delay:5.95s">生日那天赶不过来，</p>
    <p style="animation-delay:6.35s">这份补上。</p>
  </div>
  <button id="done" style="animation-delay:6.9s">周五见</button>
</div>

<!-- 收尾 -->
<div class="scr" id="s3">
  <div class="stars" id="stars"></div>
  <div class="fin">
    <div class="l1" style="animation-delay:.25s">周五晚上</div>
    <div class="l2" style="animation-delay:.7s">三北大街</div>
    <div class="l3" style="animation-delay:1.15s">慈溪 · 我到了叫你</div>
    <div class="sig" style="animation-delay:1.6s">—— 安俊</div>
  </div>
</div>

<div id="flash"></div>

<!-- 编辑入口 -->
<div id="ed">✎</div>

<!-- 编辑面板 -->
<div id="panel">
  <div class="pbox">
    <div class="pt">编辑特等奖</div>
    <div class="ptip">改完点保存，直接递给她抽就行</div>
    <label>奖品名<input id="f0" maxlength="12"></label>
    <label>内容（可换行，最多 4 行）<textarea id="f1" maxlength="80"></textarea></label>
    <label>领取方式<input id="f2" maxlength="16"></label>
    <label>送达时间<input id="f3" maxlength="16"></label>
    <label>有效期<input id="f4" maxlength="16"></label>
    <div class="btns">
      <button id="bsave">保存</button>
      <button id="breset">恢复默认</button>
      <button id="bclose">关闭</button>
    </div>
    <div id="lnk"></div>
  </div>
</div>

<script>
window.__err = "none";
window.onerror = function(m){ window.__err = m; };

var DEF = {
  t: "特 等 奖",
  p: "一个从常熟\n过来的人",
  r1: "抬头",
  r2: "周五晚上",
  r3: "你说了算"
};
var cfg = { t:DEF.t, p:DEF.p, r1:DEF.r1, r2:DEF.r2, r3:DEF.r3 };

function merge(o){
  if(!o) return;
  ["t","p","r1","r2","r3"].forEach(function(k){
    if(typeof o[k] === "string" && o[k].length) cfg[k] = o[k];
  });
}

// 载入：优先链接里的配置，其次本机保存
(function loadCfg(){
  try{
    var h = decodeURIComponent(location.hash.slice(1));
    if(h){ merge(JSON.parse(h)); return; }
  }catch(e){}
  try{
    var s = localStorage.getItem("bdayCfg");
    if(s) merge(JSON.parse(s));
  }catch(e){}
})();

function render(){
  document.getElementById("pBadge").textContent = cfg.t;
  var el = document.getElementById("pPrize");
  el.textContent = cfg.p;
  var ls = cfg.p.split("\n"), mx = 0;
  ls.forEach(function(s){ if(s.length > mx) mx = s.length; });
  el.style.fontSize = (ls.length >= 4 || mx > 12 ? 17 : ls.length === 3 || mx > 9 ? 19 : 22) + "px";
  document.getElementById("pR1").textContent = cfg.r1;
  document.getElementById("pR2").textContent = cfg.r2;
  document.getElementById("pR3").textContent = cfg.r3;
}
render();

/* ---------- 转盘 ---------- */
var PRIZES = ["一束花","一个蛋糕","520","一个拥抱","特等奖"];
var GOLD = 4;
var SEG = 360 / PRIZES.length;
var disc = document.getElementById("disc");
var go = document.getElementById("go");
var msg = document.getElementById("msg");

var _W = disc.offsetWidth || 300;
var _R = _W * 0.31;
PRIZES.forEach(function(name, i){
  var ang = (i * SEG + SEG / 2) * Math.PI / 180;
  var wrap = document.createElement("div");
  wrap.className = "lbl" + (i === GOLD ? " gold" : "");
  var sp = document.createElement("span");
  sp.textContent = name;
  sp.style.left = Math.round(Math.sin(ang) * _R) + "px";
  sp.style.top  = Math.round(-Math.cos(ang) * _R) + "px";
  wrap.appendChild(sp);
  disc.appendChild(wrap);
});

var rot = 0, tries = 0, busy = false;
var PLAN = [0, 1, GOLD];
var ICO = {"一束花":"💐","一个蛋糕":"🎂","520":"🧧","一个拥抱":"🤗","特等奖":"🏆"};
var pin = document.querySelector(".pin");
var flash = document.getElementById("flash");

// 收尾页的浮尘
(function makeStars(){
  var box = document.getElementById("stars");
  for(var i = 0; i < 22; i++){
    var s = document.createElement("i");
    var sz = (2 + Math.random() * 2.6).toFixed(1) + "px";
    s.style.width = sz; s.style.height = sz;
    s.style.left = (Math.random() * 100).toFixed(1) + "%";
    s.style.top = (14 + Math.random() * 72).toFixed(1) + "%";
    s.style.animationDelay = (Math.random() * 4.2).toFixed(2) + "s";
    s.style.animationDuration = (3.2 + Math.random() * 2.6).toFixed(2) + "s";
    box.appendChild(s);
  }
})();

function angleFor(i){
  var a = (-(i * SEG + SEG / 2)) % 360;
  return (a + 360) % 360;
}

function spin(){
  if(busy || tries >= 3) return;
  busy = true; go.disabled = true; msg.textContent = "……";
  disc.classList.add("spinning"); pin.classList.add("shake");
  var idx = PLAN[tries];
  var r = angleFor(idx);
  while(r < rot + 360 * 4) r += 360;
  rot = r;
  disc.style.transform = "rotate(" + rot + "deg)";
  setTimeout(function(){
    busy = false; tries++; go.disabled = false;
    disc.classList.remove("spinning"); pin.classList.remove("shake");
    if(idx === GOLD){
      msg.textContent = "！";
      document.getElementById("pIco").textContent = ICO[PRIZES[idx]] || "🎁";
      document.getElementById("pcard").classList.add("gold");
      flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
      setTimeout(function(){
        document.getElementById("s0").classList.add("gone");
        document.getElementById("s1").classList.add("on");
      }, 600);
    }else{
      msg.textContent = PRIZES[idx] + " ✓ 还有 " + (3 - tries) + " 次";
    }
  }, 3900);
}
go.addEventListener("click", spin);

document.getElementById("claim").addEventListener("click", function(){
  document.getElementById("s1").classList.add("gone");
  setTimeout(function(){
    document.getElementById("s2").classList.add("on");
  }, 450);
});

document.getElementById("done").addEventListener("click", function(){
  document.getElementById("s2").classList.add("gone");
  setTimeout(function(){
    document.getElementById("s3").classList.add("on");
  }, 450);
});

/* ---------- 编辑 ---------- */
var panel = document.getElementById("panel");
var F = ["f0","f1","f2","f3","f4"];
var K = ["t","p","r1","r2","r3"];

function fillForm(){
  F.forEach(function(id, i){ document.getElementById(id).value = cfg[K[i]]; });
}

function openPanel(){
  fillForm();
  panel.classList.add("on");
  document.getElementById("lnk").classList.remove("on");
}

document.getElementById("ed").addEventListener("click", openPanel);

// 连点标题 5 次也能进
var taps = 0, tapT = null;
document.getElementById("ttl").addEventListener("click", function(){
  taps++;
  clearTimeout(tapT);
  tapT = setTimeout(function(){ taps = 0; }, 900);
  if(taps >= 5){ taps = 0; openPanel(); }
});

document.getElementById("bclose").addEventListener("click", function(){
  panel.classList.remove("on");
});

document.getElementById("breset").addEventListener("click", function(){
  cfg = { t:DEF.t, p:DEF.p, r1:DEF.r1, r2:DEF.r2, r3:DEF.r3 };
  fillForm();
});

document.getElementById("bsave").addEventListener("click", function(){
  F.forEach(function(id, i){
    var v = document.getElementById(id).value;
    cfg[K[i]] = v.length ? v : DEF[K[i]];
  });
  try{ localStorage.setItem("bdayCfg", JSON.stringify(cfg)); }catch(e){}
  render();
  // 回到开场，可以立刻演示
  document.getElementById("s3").classList.remove("on");
  document.getElementById("s2").classList.remove("on");
  document.getElementById("s1").classList.remove("on");
  document.getElementById("pcard").classList.remove("gold");
  disc.classList.remove("spinning"); pin.classList.remove("shake");
  flash.classList.remove("on");
  document.getElementById("s0").classList.remove("gone");
  disc.style.transform = "rotate(0deg)";
  rot = 0; tries = 0; busy = false; go.disabled = false;
  msg.textContent = "点一下试试";
  makeLink();   // 显示可分享链接，面板不关，看完再点关闭
});

// 长按"保存"给出可分享的链接（换设备也不丢）
var holdT = null;
var bsave = document.getElementById("bsave");
function makeLink(){
  F.forEach(function(id, i){
    var v = document.getElementById(id).value;
    cfg[K[i]] = v.length ? v : DEF[K[i]];
  });
  var base = location.href.split("#")[0];
  var url = base + "#" + encodeURIComponent(JSON.stringify(cfg));
  var box = document.getElementById("lnk");
  box.innerHTML = "";
  var tip = document.createElement("div");
  tip.textContent = "已保存 · 当面玩直接点关闭；想发给她就复制下面这行";
  tip.style.color = "#8a80a8";
  box.appendChild(tip);
  var u = document.createElement("div");
  u.textContent = url;
  u.style.marginTop = "7px";
  u.style.color = "#cfc7e2";
  box.appendChild(u);
  box.classList.add("on");
  try{ if(navigator.clipboard) navigator.clipboard.writeText(url); }catch(e){}
}
bsave.addEventListener("touchstart", function(){ holdT = setTimeout(makeLink, 700); }, {passive:true});
bsave.addEventListener("touchend", function(){ clearTimeout(holdT); }, {passive:true});
bsave.addEventListener("mousedown", function(){ holdT = setTimeout(makeLink, 700); });
bsave.addEventListener("mouseup", function(){ clearTimeout(holdT); });
</script>
