<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>距离</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05050c;color:#e9e9f2;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
user-select:none;-webkit-user-select:none;touch-action:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
opacity:0;pointer-events:none;transition:opacity .85s ease;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr.on{opacity:1;pointer-events:auto}
.gone{opacity:0!important;pointer-events:none!important}

#t0{font-size:22px;line-height:2.1;letter-spacing:1px;color:#d8d8e6;text-align:center;padding:0 36px}
#t0 div{min-height:1.2em}

.hint{font-size:13px;color:#7c7c90;letter-spacing:3px;margin-bottom:40px}
.num{font-size:clamp(64px,20vw,96px);font-weight:200;letter-spacing:-3px;
font-variant-numeric:tabular-nums;color:#fff;line-height:1;
display:flex;align-items:baseline;gap:7px}
.num i{font-size:19px;font-style:normal;color:#66667c;letter-spacing:0;font-weight:400}
.track{width:76%;height:2px;background:rgba(255,255,255,.1);margin-top:50px;position:relative;border-radius:2px}
.dot{position:absolute;top:50%;left:0;width:9px;height:9px;border-radius:50%;background:#fff;
transform:translate(-50%,-50%);box-shadow:0 0 16px 4px rgba(175,145,255,.7)}
.tip{margin-top:26px;font-size:13px;color:#a294c9;height:18px;letter-spacing:1.5px;
opacity:0;transition:opacity .6s}
.tip.on{opacity:1}
.pads{position:absolute;bottom:calc(76px + env(safe-area-inset-bottom));left:0;right:0;
display:flex;justify-content:space-between;padding:0 38px}
.pad{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:13px;letter-spacing:3px;color:#b3a2dc;border:1px solid rgba(170,140,255,.26);
background:radial-gradient(circle at 50% 38%,rgba(120,90,200,.20),rgba(255,255,255,.015) 72%);
transition:transform .12s ease,box-shadow .28s ease,border-color .28s ease}
.pad.on{transform:scale(1.07);border-color:rgba(195,165,255,.8);
box-shadow:0 0 34px 7px rgba(150,110,255,.32),inset 0 0 26px rgba(160,120,255,.16)}

#s2{padding:0 32px}
#body2{width:100%;text-align:center}
.ln{font-size:19px;line-height:2;color:#cfcfdd;opacity:0;transform:translateY(9px);
transition:opacity .85s ease,transform .85s ease}
.ln.in{opacity:1;transform:none}
.ln.big{font-size:33px;font-weight:300;color:#fff;letter-spacing:3px;margin:26px 0;line-height:1.6}
.sign{margin-top:46px;font-size:14px;color:#7a7a90;letter-spacing:2px;
opacity:0;transition:opacity 1.1s}
.sign.in{opacity:1}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:99;
transition:opacity .2s ease}
.flash.on{opacity:1}
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<div class="scr on" id="s0"><div id="t0"></div></div>

<div class="scr" id="s1">
  <div class="hint" id="hint">按住，让它靠近</div>
  <div class="num"><span id="km">211.0</span><i>km</i></div>
  <div class="track"><div class="dot" id="dot"></div></div>
  <div class="tip" id="tip"></div>
  <div class="pads">
    <div class="pad" id="padL">按住</div>
    <div class="pad" id="padR">按住</div>
  </div>
</div>

<div class="scr" id="s2"><div id="body2"></div></div>

<script>
(function(){
"use strict";

var S = {
  intro: [
    "从常熟到慈溪。",
    "211 公里。",
    "我一个人走了很久。",
    "最后这一段——",
    "需要你按一下。"
  ],
  tipHalf: "我一个人，只能走到这里。",
  tipBoth: "还差一半。",
  lines: [
    "0.0 公里。",
    "我到了。",
    "",
    "陆玉纯。",
    "生日快乐。",
    "",
    "这句话我想了很久——",
    "我喜欢你。",
    "不用现在回答。",
    "你只要知道，这 211 公里，我走完了。"
  ],
  bigIdx: 7,
  sign: "—— 安俊"
};

var FULL = 211.0;
var HALF = 105.5;

var $ = function(id){ return document.getElementById(id); };
var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

var km = FULL, L = false, R = false, running = false, done = false, last = 0;

function paint(){
  $("km").textContent = km.toFixed(1);
  $("dot").style.left = ((FULL - km) / FULL * 100) + "%";
}

function typeInto(el, text, speed){
  return new Promise(function(res){
    var i = 0;
    (function step(){
      if(i >= text.length){ res(); return; }
      el.textContent += text.charAt(i++);
      setTimeout(step, speed);
    })();
  });
}

function loop(){
  if(done) return;
  var now = performance.now();
  var dt = Math.min((now - last) / 1000, 0.06);
  last = now;

  var both = L && R;
  var one = (L || R) && !both;

  if(both){
    km = Math.max(0, km - 48 * dt);
    $("tip").classList.remove("on");
  } else if(one){
    km = Math.max(HALF, km - 20 * dt);
    if(km <= HALF + 0.06){
      $("tip").textContent = S.tipHalf;
      $("tip").classList.add("on");
    }
  }

  paint();

  if(km <= 0){ done = true; unlock(); return; }
  requestAnimationFrame(loop);
}

function unlock(){
  $("km").textContent = "0.0";
  $("dot").style.left = "100%";
  $("tip").classList.remove("on");

  var f = $("flash");
  f.classList.add("on");
  setTimeout(function(){ f.classList.remove("on"); }, 240);

  setTimeout(function(){
    $("s1").classList.add("gone");
    setTimeout(async function(){
      $("s2").classList.add("on");
      await showLines();
    }, 520);
  }, 820);
}

async function showLines(){
  var box = $("body2");
  for(var i = 0; i < S.lines.length; i++){
    var txt = S.lines[i];
    if(txt === ""){ await sleep(460); continue; }
    var d = document.createElement("div");
    d.className = "ln" + (i === S.bigIdx ? " big" : "");
    d.textContent = txt;
    box.appendChild(d);
    await sleep(40);
    d.classList.add("in");
    await sleep(i === S.bigIdx ? 1900 : 980);
  }
  var sg = document.createElement("div");
  sg.className = "sign";
  sg.textContent = S.sign;
  box.appendChild(sg);
  await sleep(120);
  sg.classList.add("in");
}

function bindPad(el, setter){
  el.addEventListener("pointerdown", function(e){
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    setter(true);
    el.classList.add("on");
    if(!running){
      running = true;
      last = performance.now();
      requestAnimationFrame(loop);
    }
  });
  var up = function(){
    setter(false);
    el.classList.remove("on");
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
}

async function boot(){
  var t0 = $("t0");
  for(var i = 0; i < S.intro.length; i++){
    var d = document.createElement("div");
    t0.appendChild(d);
    await typeInto(d, S.intro[i], 115);
    await sleep(400);
  }
  await sleep(700);
  $("s0").classList.add("gone");
  setTimeout(function(){
    $("s1").classList.add("on");
    bindPad($("padL"), function(v){ L = v; });
    bindPad($("padR"), function(v){ R = v; });
    paint();
  }, 560);
}

boot();

})();
</script>
</body>
</html>
