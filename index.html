<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>接上</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#08070d;color:#ece8f5;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}

  .scr{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0 8vw;
    opacity:0;pointer-events:none;transition:opacity .7s ease}
  .scr.on{opacity:1;pointer-events:auto}
  .scr.gone{opacity:0;pointer-events:none}

  /* ---- 第一屏：划线段 ---- */
  .ends{width:84vw;display:flex;justify-content:space-between;
    font-size:12px;letter-spacing:3px;color:#5f5878;margin-bottom:14px}
  .ends .r{color:#8b82a8}

  .track{position:relative;width:84vw;height:56px;display:flex;align-items:center}
  .base{position:absolute;left:0;right:0;height:1px;
    background:repeating-linear-gradient(to right,#2a2440 0 5px,transparent 5px 11px)}
  .fill{position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:2px;width:0;background:linear-gradient(90deg,#8a6b2e,#f5c563,#ffe9a8);
    box-shadow:0 0 12px rgba(245,197,99,.55);border-radius:2px;
    transition:width .06s linear}
  .node{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    transform:translate(-50%,-50%);background:#3a3355;
    transition:background .3s,box-shadow .3s}
  .node.a{left:0;background:#f5c563;box-shadow:0 0 10px rgba(245,197,99,.6)}
  .node.b{left:100%}
  .node.b.on{background:#f5c563;box-shadow:0 0 16px rgba(245,197,99,.9)}

  .hint{margin-top:34px;font-size:14px;color:#8b82a8;letter-spacing:2px;
    text-align:center;line-height:1.9;animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  #fb{margin-top:26px;font-size:13px;color:#6f6889;letter-spacing:1px;
    border-bottom:1px solid #2a2440;padding-bottom:3px;
    opacity:0;transition:opacity .5s;pointer-events:none}
  #fb.on{opacity:1;pointer-events:auto}

  /* ---- 第二屏：文字 ---- */
  #s1{gap:0}
  .lw{display:flex;flex-direction:column;gap:20px;width:100%;max-width:340px}
  .ln{opacity:0;transform:translateY(10px);
    transition:opacity .9s ease,transform .9s ease;
    font-size:17px;line-height:1.75;letter-spacing:1.5px;color:#cfc7e2}
  .ln.on{opacity:1;transform:translateY(0)}
  .ln.big{font-size:30px;font-weight:600;color:#fff;letter-spacing:4px;
    margin-bottom:6px}
  .ln.gap{height:8px}
  .ln.dim{color:#8b82a8}
  .ln.sig{font-size:14px;color:#6f6889;letter-spacing:2px;margin-top:14px}
</style>
</head>
<body>

<div class="scr on" id="s0">
  <div class="ends"><span>很久以前</span><span class="r">现在</span></div>
  <div class="track" id="track">
    <div class="base"></div>
    <div class="fill" id="fill"></div>
    <div class="node a"></div>
    <div class="node b" id="nb"></div>
  </div>
  <div class="hint" id="hint">用手指<br>从左边划到右边</div>
  <div id="fb">划不动就点这里</div>
</div>

<div class="scr" id="s1">
  <div class="lw" id="lw"></div>
</div>

<script>
window.__err = "none";
window.onerror = function(m){ window.__err = m; };

var LINES = [
  {t:"接上了。", c:"big"},
  {t:"中间隔了很多年。"},
  {t:"这次是 11 月 13 日。"},
  {t:"接着往下走。"},
  {t:"—— 安俊", c:"sig"}
];

var track = document.getElementById("track");
var fill  = document.getElementById("fill");
var nb    = document.getElementById("nb");
var hint  = document.getElementById("hint");
var fb    = document.getElementById("fb");
var prog = 0, done = false;

function setProg(p){
  if(done) return;
  p = Math.max(0, Math.min(1, p));
  if(p <= prog) return;
  prog = p;
  fill.style.width = (prog * 100).toFixed(2) + "%";
  if(prog >= 0.995) finish();
}

function fromX(x){
  var r = track.getBoundingClientRect();
  if(!r.width) return;
  setProg((x - r.left) / r.width);
}

document.addEventListener("pointermove", function(e){ fromX(e.clientX); }, {passive:true});
document.addEventListener("touchmove", function(e){
  if(e.touches && e.touches[0]) fromX(e.touches[0].clientX);
}, {passive:true});

function finish(){
  if(done) return;
  done = true;
  prog = 1;
  fill.style.width = "100%";
  nb.classList.add("on");
  hint.style.opacity = "0";
  fb.classList.remove("on");
  setTimeout(function(){
    document.getElementById("s0").classList.add("gone");
    document.getElementById("s1").classList.add("on");
    showLines();
  }, 800);
}

function showLines(){
  var lw = document.getElementById("lw");
  var d = 250;
  LINES.forEach(function(o){
    var el = document.createElement("div");
    el.className = "ln" + (o.c ? " " + o.c : "");
    el.textContent = o.t;
    lw.appendChild(el);
    var t = d;
    setTimeout(function(){ el.classList.add("on"); }, t);
    d += (o.c === "big" ? 1500 : 950);
  });
}

// 兜底：9 秒没动作，给点击入口
var fbTimer = setTimeout(function(){ fb.classList.add("on"); }, 9000);
fb.addEventListener("click", function(){
  clearTimeout(fbTimer);
  var t0 = Date.now();
  var iv = setInterval(function(){
    var p = Math.min(1, (Date.now() - t0) / 1100);
    setProg(p);
    if(p >= 1) clearInterval(iv);
  }, 28);
});
</script>
</body>
</html>
