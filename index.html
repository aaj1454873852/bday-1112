<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>生日抽奖</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0714;color:#f2eefb;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}

  .scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:32px 22px;opacity:0;pointer-events:none;
    transition:opacity .5s ease}
  .scr.on{opacity:1;pointer-events:auto}
  .scr.gone{opacity:0;pointer-events:none}

  .kicker{font-size:13px;letter-spacing:6px;color:#8a80a8}
  h1{font-size:24px;font-weight:600;letter-spacing:2px;text-align:center}
  .sub{font-size:13px;color:#8a80a8;letter-spacing:1px;text-align:center;line-height:1.9}

  /* 转盘 */
  .wheel{position:relative;width:min(78vw,320px);aspect-ratio:1/1;margin:6px 0}
  .disc{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(
      #2b2440 0deg 60deg,
      #3a3060 60deg 120deg,
      #2b2440 120deg 180deg,
      #3a3060 180deg 240deg,
      #2b2440 240deg 300deg,
      #f5b942 300deg 360deg);
    box-shadow:0 0 0 8px #171128,0 0 0 9px #2f2648,0 18px 50px rgba(0,0,0,.6);
    transition:transform 3.8s cubic-bezier(.16,.72,.16,1);
    will-change:transform}
  .disc.spin{transition:transform 3.8s cubic-bezier(.16,.72,.16,1)}
  .lbl{position:absolute;left:50%;top:50%;width:0;height:0;font-size:12px;
    color:#e8e2f7;letter-spacing:1px;white-space:nowrap}
  .lbl span{position:absolute;transform:translate(-50%,-50%)}
  .lbl.gold{color:#3a2a00;font-weight:700}

  .pin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);
    width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
    border-top:22px solid #fff;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:3}

  #go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:26%;aspect-ratio:1/1;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#fff,#d9d2ef);
    color:#1a1230;font-size:15px;font-weight:700;letter-spacing:2px;
    box-shadow:0 6px 18px rgba(0,0,0,.55),0 0 0 4px #0a0714;
    transition:transform .12s}
  #go:active{transform:translate(-50%,-50%) scale(.94)}
  #go[disabled]{opacity:.5}

  .msg{font-size:15px;color:#c9c0e0;letter-spacing:1px;text-align:center;
    min-height:24px;line-height:1.7}

  /* 中奖卡 */
  .card{width:min(84vw,340px);border-radius:20px;padding:26px 22px;
    background:linear-gradient(160deg,#221a3a,#151024);
    border:1px solid #3a2f5c;box-shadow:0 24px 60px rgba(0,0,0,.7);
    display:flex;flex-direction:column;gap:14px;align-items:center}
  .badge{font-size:12px;letter-spacing:4px;color:#f5b942}
  .prize{font-size:22px;font-weight:700;text-align:center;line-height:1.5}
  .row{width:100%;display:flex;justify-content:space-between;font-size:14px;
    color:#a99fc4;padding:9px 0;border-bottom:1px dashed #2e2547}
  .row b{color:#f2eefb;font-weight:500}
  .row:last-of-type{border-bottom:none}
  #claim{width:100%;margin-top:6px;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(90deg,#f5b942,#ffd97a);color:#2a1d00;
    font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer}
  #claim:active{opacity:.85}

  /* 最后一页 */
  .fin{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
  .fin .l1{font-size:15px;color:#8a80a8;letter-spacing:2px}
  .fin .l2{font-size:26px;font-weight:600;letter-spacing:3px}
  .fin .l3{font-size:14px;color:#a99fc4;letter-spacing:1px}
  .fin .sig{font-size:13px;color:#6f6688;letter-spacing:2px;margin-top:10px}
</style>
</head>
<body>

<!-- 开场 -->
<div class="scr on" id="s0">
  <div class="kicker">11 · 12</div>
  <h1>陆玉纯的生日抽奖</h1>
  <div class="sub">三次机会<br>点中间按钮</div>
  <div class="wheel">
    <div class="pin"></div>
    <div class="disc" id="disc"></div>
    <button id="go">抽奖</button>
  </div>
  <div class="msg" id="msg">点一下试试</div>
</div>

<!-- 中奖 -->
<div class="scr" id="s1">
  <div class="card">
    <div class="badge">特 等 奖</div>
    <div class="prize">一个从常熟<br>过来的人</div>
    <div class="row"><span>领取方式</span><b>抬头</b></div>
    <div class="row"><span>送达时间</span><b>周五晚上</b></div>
    <div class="row"><span>有效期</span><b>你说了算</b></div>
    <button id="claim">确认领取</button>
  </div>
</div>

<!-- 收尾 -->
<div class="scr" id="s2">
  <div class="fin">
    <div class="l1">已领取</div>
    <div class="l2">周五见</div>
    <div class="l3">慈溪，三北大街</div>
    <div class="sig">—— 安俊</div>
  </div>
</div>

<script>
window.__err = "none";
window.onerror = function(m){ window.__err = m; };

var PRIZES = ["谢谢参与","再来一次","5 元红包","谢谢参与","免费拥抱","特等奖"];
var GOLD = 5;
var SEG = 360 / PRIZES.length;
var disc = document.getElementById("disc");
var go = document.getElementById("go");
var msg = document.getElementById("msg");

// 生成扇区文字（正立，按角度摆在半径 31% 处）
var _W = disc.offsetWidth || 300;
var _R = _W * 0.31;
PRIZES.forEach(function(name, i){
  var ang = (i * SEG + SEG / 2) * Math.PI / 180;
  var wrap = document.createElement("div");
  wrap.className = "lbl" + (i === GOLD ? " gold" : "");
  var sp = document.createElement("span");
  sp.textContent = name;
  sp.style.left = Math.round(Math.sin(ang) * _R) + "px";
  sp.style.top = Math.round(-Math.cos(ang) * _R) + "px";
  wrap.appendChild(sp);
  disc.appendChild(wrap);
});

var rot = 0;
var tries = 0;
var PLAN = [0, 1, GOLD];   // 第一把谢谢参与、第二把再来一次、第三把特等奖
var busy = false;

function angleFor(i){
  var a = (-(i * SEG + SEG / 2)) % 360;
  return (a + 360) % 360;
}

function spin(){
  if(busy || tries >= 3) return;
  busy = true;
  go.disabled = true;
  msg.textContent = "……";

  var idx = PLAN[tries];
  var base = angleFor(idx);
  var r = base;
  while(r < rot + 360 * 4) r += 360;
  rot = r;
  disc.style.transform = "rotate(" + rot + "deg)";

  setTimeout(function(){
    busy = false;
    tries++;
    go.disabled = false;
    if(idx === GOLD){
      msg.textContent = "！";
      setTimeout(function(){
        document.getElementById("s0").classList.add("gone");
        document.getElementById("s1").classList.add("on");
      }, 600);
    } else {
      msg.textContent = tries === 1 ? "手气一般，还有两次" : "就差一点，最后一次";
    }
  }, 3900);
}

go.addEventListener("click", spin);

document.getElementById("claim").addEventListener("click", function(){
  document.getElementById("s1").classList.add("gone");
  setTimeout(function(){
    document.getElementById("s2").classList.add("on");
  }, 450);
});
</script>
</body>
</html>
